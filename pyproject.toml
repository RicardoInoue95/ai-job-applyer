# Sem [project]/[build-system] de propósito: o projeto é uma aplicação executada
# in-place, não um pacote distribuível. Este arquivo existe para configurar
# ferramentas.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Marcadores 'live' saem por padrão: tocam rede/site de terceiros e não devem
# rodar em suíte automática. Habilite com: pytest -m live
addopts = "-m 'not live' --strict-markers -q"
markers = [
    "e2e: usa Playwright real contra HTML local (sem rede). Exige browser instalado.",
    "live: toca rede ou site de terceiros. NUNCA roda por padrão nem em CI.",
    "db: exige PostgreSQL de pé.",
    "pessoal: compara com data/config.json e data/resume.json do candidato; pula quando ausentes (ver tests/conftest.py).",
]
filterwarnings = [
    # DeprecationWarning vindo do nosso próprio código é erro; de dependência, não.
    "error::DeprecationWarning:jobapplier.*",
    "default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "jobapplier/database/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — variável/import não usado, f-string sem placeholder
    "I",        # isort — ordenação de imports
    "UP",       # pyupgrade — sintaxe moderna
    "B",        # bugbear — armadilhas reais (mutable default, except cego)
    "DTZ",      # datetime sem timezone — o projeto já tem essa dívida
    "SIM",      # simplificações
    "RUF",      # regras do próprio ruff
]
ignore = [
    "E501",     # comprimento de linha: formatter cuida
    "B008",     # chamada em default de argumento (padrão comum no FastAPI/Streamlit)
    "SIM108",   # ternário obrigatório prejudica legibilidade em alguns casos
    # Os dois abaixo foram avaliados caso a caso e recusados por mérito, não por
    # conveniência — o resto do conjunto está zerado.
    "SIM102",   # 'if' aninhado colapsável. Nos 17 casos restantes o próprio ruff
                # se recusa a aplicar o fix (há comentário entre as condições, ou
                # a condição unida passaria de 100 colunas). Em _auto_answer, a
                # forma aninhada 'se o label é sobre X' → 'se o campo é Sim/Não'
                # expressa a decisão em dois passos, que é como ela é pensada.
    "RUF001",   # caractere unicode "ambíguo" em string. São travessão (–) e ›
                # em texto de UI em português: tipografia intencional, não erro
                # de digitação de hífen ou maior-que.
]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar assert, nomes longos e imports locais à vontade.
"tests/**" = ["B011", "E402"]
# Streamlit exige set_page_config antes de qualquer outro comando, e _bootstrap
# precisa vir antes dos imports de jobapplier — ambos forçam import fora do topo.
"ui/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["jobapplier"]
