services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobapplier
      POSTGRES_USER: jobapplier
      POSTGRES_PASSWORD: jobapplier
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapplier"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
